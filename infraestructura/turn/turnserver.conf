# Servidor TURN de Taxi Malabo (coturn).
#
# QUÉ HACE. Cuando el pasajero y el taxista están detrás del NAT compartido del
# operador móvil —lo normal en datos móviles— sus teléfonos no pueden verse
# directamente y la llamada no se establece. Este servidor hace de puente: el
# audio pasa por él. Es la única pieza de las llamadas que necesita
# infraestructura propia, y la única por la que pasa audio.
#
# QUÉ NO HACE. No descifra nada: WebRTC va cifrado de extremo a extremo (DTLS-
# SRTP) y el puente solo reenvía paquetes que no puede leer. Aun así, procura
# que sea una máquina tuya y no de un tercero.
#
# DÓNDE VA. En un servidor con IP pública, cerca de Malabo en términos de red
# (Europa occidental suele dar mejor latencia hacia Guinea Ecuatorial que
# Norteamérica). Un servidor pequeño basta para empezar: lo que se agota antes
# es el ancho de banda, no la CPU.
#
# Instalación en Debian/Ubuntu:
#   sudo apt install coturn
#   sudo cp turnserver.conf /etc/turnserver.conf
#   # editar las tres líneas marcadas con CAMBIAR
#   sudo systemctl enable --now coturn

# --- Identidad del servidor -------------------------------------------------

# CAMBIAR: la IP pública de la máquina.
listening-ip=0.0.0.0
external-ip=CAMBIAR_IP_PUBLICA

# CAMBIAR: el dominio con el que se anuncia. Tiene que coincidir con el del
# certificado si usas TLS.
realm=turn.taximalabo.gq
server-name=turn.taximalabo.gq

listening-port=3478
tls-listening-port=5349

# --- Autenticación ----------------------------------------------------------
#
# Credenciales efímeras firmadas, NO usuario y contraseña fijos.
#
# La aplicación es una PWA: cualquier contraseña que viaje dentro de ella es
# pública en cuanto alguien abre las herramientas del navegador, y a partir de
# ahí el puente es ancho de banda gratis a costa tuya. En su lugar, el servidor
# de la aplicación firma con este mismo secreto un usuario que caduca a los 15
# minutos, y solo se lo entrega a quien va en un viaje en curso.
#
# Ver credencialesEfimeras() en servidor/src/api/llamadas.ts.
#
# CAMBIAR: el mismo valor que la variable de entorno TURN_SECRETO del servidor
# de la aplicación. Genéralo con:  openssl rand -hex 32
use-auth-secret
static-auth-secret=CAMBIAR_SECRETO_COMPARTIDO

# --- Cerrar lo que no se usa ------------------------------------------------
#
# Un TURN abierto es un proxy abierto: se usa para escanear redes ajenas y para
# alcanzar servicios internos desde fuera. Todo esto es para que no lo sea.

# Nada de reenviar hacia redes privadas ni hacia la propia máquina.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Solo se necesita voz: sin multidifusión, sin bases de datos, sin CLI remota.
no-multicast-peers
no-cli
no-sslv3
no-tlsv1
no-tlsv1_1

# Techo de tráfico por sesión (kbit/s). Una llamada de voz cabe de sobra en 64;
# el resto sería alguien colando vídeo o datos por el puente.
max-bps=64000

# Techo total del servidor (bytes por segundo). Ajústalo a lo que tengas
# contratado: es la diferencia entre quedarte sin cuota y degradar llamadas.
# 6 MB/s ≈ 48 Mbit/s ≈ unas 1.500 llamadas de voz simultáneas.
bulk-quota=0
total-quota=0
user-quota=0

# Puertos por los que se reenvía el audio. Tienen que estar abiertos en el
# cortafuegos, en UDP.
min-port=49152
max-port=65535

# --- TLS --------------------------------------------------------------------
#
# Recomendado: algunas redes corporativas y de hotel bloquean todo lo que no sea
# el puerto 443/TLS, y sin esto esas llamadas no salen. Con certbot:
#   sudo certbot certonly --standalone -d turn.taximalabo.gq
# cert=/etc/letsencrypt/live/turn.taximalabo.gq/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.taximalabo.gq/privkey.pem

# --- Registro ---------------------------------------------------------------
#
# Sin volcado de todo el tráfico: no hace falta y sería recoger datos de gente
# que no ha dado permiso para nada de eso.
log-file=/var/log/coturn/turnserver.log
simple-log
no-stdout-log
